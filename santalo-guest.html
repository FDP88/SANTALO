<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0"/>
  <title>Santalò — Benvenuto</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,600&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --brown: #6B2D1F;
      --brown-d: #3d1a10;
      --brown-l: #8C4F35;
      --sand: #C4A882;
      --sand-l: #E8D9C0;
      --sand-ll: #F5EDE0;
      --cream: #FAF7F2;
      --cream-d: #F0E6D8;
      --ink: #2E241F;
      --muted: #7A6B61;
      --line: rgba(107,45,31,.13);
      /* Camera colors — overridden by JS */
      --cam-primary: #6B2D1F;
      --cam-dark: #3d1a10;
      --cam-light: #E8D9C0;
      --cam-mid: #C4A882;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    body {
      font-family: 'DM Sans', system-ui, sans-serif;
      background: var(--cream);
      color: var(--ink);
      min-height: 100vh;
      max-width: 480px;
      margin: 0 auto;
    }

    /* ===== HERO ===== */
    .hero {
      background: var(--cam-primary);
      padding: 0;
      position: relative;
      overflow: hidden;
      min-height: 220px;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
    }
    .hero-bg-year {
      position: absolute;
      top: 50%; left: 50%;
      transform: translate(-50%, -55%);
      font-family: 'Cormorant Garamond', serif;
      font-size: 160px;
      font-weight: 700;
      color: rgba(255,255,255,.07);
      letter-spacing: -4px;
      white-space: nowrap;
      pointer-events: none;
      user-select: none;
      line-height: 1;
    }
    .hero-content {
      position: relative;
      z-index: 2;
      padding: 28px 24px 26px;
    }
    .hero-logo-wrap {
      display: flex; align-items: center; gap: 12px; margin-bottom: 16px;
    }
    .hero-logo {
      width: 42px; height: 42px;
      background: rgba(255,255,255,.15);
      border-radius: 10px;
      overflow: hidden;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
    }
    .hero-logo img { width: 100%; height: 100%; object-fit: cover; }
    .hero-bb {
      font-size: 11px; font-weight: 600; letter-spacing: .1em;
      text-transform: uppercase; color: rgba(255,255,255,.7);
    }
    .hero-year {
      font-family: 'Cormorant Garamond', serif;
      font-size: 72px; font-weight: 700; line-height: .9;
      color: #fff; letter-spacing: -2px;
      margin-bottom: 6px;
    }
    .hero-floor {
      font-size: 12px; font-weight: 500; letter-spacing: .06em;
      text-transform: uppercase;
      color: rgba(255,255,255,.65);
      margin-bottom: 14px;
    }
    .hero-guest-pill {
      display: inline-flex; align-items: center; gap: 7px;
      background: rgba(255,255,255,.15);
      border: 1px solid rgba(255,255,255,.2);
      border-radius: 999px; padding: 6px 14px;
      font-size: 12px; font-weight: 500; color: #fff;
    }
    .hero-guest-pill svg { width: 13px; height: 13px; opacity: .7; }
    .hero-dates {
      display: flex; gap: 6px; margin-top: 8px;
    }
    .hero-date-chip {
      background: rgba(255,255,255,.12);
      border: 1px solid rgba(255,255,255,.18);
      border-radius: 8px; padding: 5px 10px;
      font-size: 11px; font-weight: 600; color: rgba(255,255,255,.9);
    }
    .hero-date-chip span { opacity: .6; font-weight: 400; margin-right: 4px; }

    /* ===== ORARI VELOCI ===== */
    .quick-times {
      display: flex; gap: 0;
      background: var(--cam-dark);
      border-bottom: 1px solid rgba(255,255,255,.08);
    }
    .qt-item {
      flex: 1; text-align: center; padding: 10px 8px;
      border-right: 1px solid rgba(255,255,255,.08);
    }
    .qt-item:last-child { border-right: none; }
    .qt-label { font-size: 9px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: rgba(255,255,255,.5); margin-bottom: 2px; }
    .qt-value { font-size: 14px; font-weight: 700; color: #fff; }

    /* ===== LANG BAR ===== */
    .lang-bar {
      display: flex; gap: 5px; justify-content: center;
      padding: 12px 16px;
      background: #fff;
      border-bottom: 1px solid var(--line);
      position: sticky; top: 0; z-index: 50;
      box-shadow: 0 2px 8px rgba(107,45,31,.06);
    }
    .lang-btn {
      border: 1.5px solid var(--line);
      background: var(--cream); color: var(--muted);
      border-radius: 999px; padding: 5px 11px;
      font: inherit; font-size: 11px; font-weight: 600;
      cursor: pointer; transition: all .15s;
    }
    .lang-btn.active { background: var(--cam-primary); color: #fff; border-color: var(--cam-primary); }
    .lang-btn:hover:not(.active) { border-color: var(--cam-primary); color: var(--cam-primary); }

    /* ===== GRID ICONE ===== */
    .section-hint {
      text-align: center; font-size: 9px; font-weight: 700;
      letter-spacing: .12em; text-transform: uppercase;
      color: var(--muted); padding: 16px 20px 10px; opacity: .6;
    }
    .icons-grid {
      display: grid; grid-template-columns: repeat(3, 1fr);
      gap: 8px; padding: 0 14px 8px;
    }
    .icon-card {
      background: #fff; border: 1.5px solid var(--line);
      border-radius: 16px; padding: 16px 8px 12px;
      text-align: center; cursor: pointer;
      transition: all .18s; user-select: none;
      -webkit-tap-highlight-color: transparent;
    }
    .icon-card:active { transform: scale(.95); }
    .icon-card.active {
      border-color: var(--cam-primary);
      background: var(--cam-light);
      box-shadow: 0 0 0 3px rgba(var(--cam-rgb, 107,45,31),.1);
    }
    .icon-card svg {
      width: 26px; height: 26px;
      color: var(--cam-primary);
      display: block; margin: 0 auto 7px;
      transition: transform .18s;
    }
    .icon-card.active svg { transform: scale(1.12); }
    .icon-label {
      font-size: 9px; font-weight: 700; letter-spacing: .06em;
      text-transform: uppercase; color: var(--ink); line-height: 1.3;
    }
    .icon-card.active .icon-label { color: var(--cam-primary); }

    /* ===== PANNELLO ===== */
    .content-panel {
      margin: 10px 14px 0;
      background: #fff;
      border: 1.5px solid var(--cam-primary);
      border-radius: 18px;
      overflow: hidden;
      animation: slideDown .2s ease;
    }
    @keyframes slideDown {
      from { opacity: 0; transform: translateY(-6px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .panel-header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 14px 16px;
      background: var(--cam-light);
      border-bottom: 1px solid var(--line);
    }
    .panel-title {
      font-family: 'Cormorant Garamond', serif;
      font-size: 19px; font-weight: 600;
      color: var(--cam-dark);
      display: flex; align-items: center; gap: 9px;
    }
    .panel-title svg { width: 18px; height: 18px; color: var(--cam-primary); flex-shrink: 0; }
    .panel-close {
      background: rgba(255,255,255,.6); border: none; cursor: pointer;
      width: 26px; height: 26px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      color: var(--muted); font-size: 16px; line-height: 1;
      transition: background .15s;
    }
    .panel-close:hover { background: #fff; }
    .panel-body { padding: 16px; }

    /* Tipografia corpo pannello */
    .panel-body p { font-size: 13.5px; line-height: 1.75; color: var(--ink); margin-bottom: 10px; }
    .panel-body p:last-child { margin-bottom: 0; }
    .panel-body strong { font-weight: 600; color: var(--brown-d); }
    .panel-body a { color: var(--cam-primary); font-weight: 600; text-decoration: none; }

    /* Info boxes */
    .info-box {
      background: var(--sand-ll); border-radius: 12px;
      padding: 12px 14px; margin: 10px 0;
      border-left: 3px solid var(--cam-primary);
    }
    .info-box .lbl { font-size: 9px; font-weight: 700; text-transform: uppercase; letter-spacing: .09em; color: var(--cam-primary); margin-bottom: 3px; }
    .info-box .val { font-size: 14px; font-weight: 600; color: var(--ink); }
    .info-row { display: flex; gap: 8px; margin: 10px 0; }
    .info-row .info-box { flex: 1; margin: 0; }

    /* WiFi copiabile */
    .wifi-block {
      background: var(--cam-dark); border-radius: 14px;
      padding: 16px; margin: 10px 0;
    }
    .wifi-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
    .wifi-row:last-child { margin-bottom: 0; }
    .wifi-label { font-size: 10px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: rgba(255,255,255,.5); margin-bottom: 3px; }
    .wifi-value { font-size: 16px; font-weight: 700; color: #fff; letter-spacing: .02em; }
    .copy-btn {
      background: rgba(255,255,255,.15); border: 1px solid rgba(255,255,255,.2);
      border-radius: 8px; padding: 6px 12px;
      font: inherit; font-size: 11px; font-weight: 700;
      color: #fff; cursor: pointer; transition: background .15s;
      white-space: nowrap;
    }
    .copy-btn:hover { background: rgba(255,255,255,.25); }
    .copy-btn.copied { background: #16a34a; border-color: #16a34a; }

    /* Code accesso */
    .code-block {
      background: var(--cam-dark); color: #fff;
      border-radius: 14px; padding: 18px 20px; margin: 12px 0;
      text-align: center;
    }
    .code-block .code-label { font-size: 9px; opacity: .55; letter-spacing: .1em; text-transform: uppercase; margin-bottom: 6px; }
    .code-block .code-value { font-size: 42px; font-weight: 700; letter-spacing: 8px; font-family: 'Cormorant Garamond', serif; }

    /* Alert */
    .alert-box {
      background: #fff8ef; border: 1px solid #fcd34d;
      border-radius: 12px; padding: 11px 13px; margin: 10px 0;
      font-size: 13px; color: var(--ink); line-height: 1.6;
    }

    /* Steps */
    .step { display: flex; gap: 12px; align-items: flex-start; margin-bottom: 14px; }
    .step-num {
      width: 26px; height: 26px; background: var(--cam-primary);
      color: #fff; border-radius: 50%; font-size: 12px; font-weight: 700;
      display: flex; align-items: center; justify-content: center; flex-shrink: 0; margin-top: 1px;
    }
    .step-text { font-size: 13.5px; line-height: 1.7; color: var(--ink); }

    /* List items */
    .list-item {
      padding: 11px 0; border-bottom: 1px solid var(--line);
      display: flex; flex-direction: column; gap: 3px;
    }
    .list-item:last-child { border-bottom: none; padding-bottom: 0; }
    .li-name { font-size: 14px; font-weight: 600; color: var(--ink); }
    .li-type { font-size: 11px; color: var(--cam-primary); font-weight: 600; text-transform: uppercase; letter-spacing: .04em; }
    .li-note { font-size: 12.5px; color: var(--muted); line-height: 1.5; }
    .li-dist { font-size: 10px; font-weight: 700; color: var(--cam-primary); background: var(--cam-light); padding: 2px 8px; border-radius: 999px; }

    /* Buttons */
    .wa-btn {
      display: flex; align-items: center; justify-content: center; gap: 8px;
      background: #25D366; color: #fff; text-decoration: none;
      padding: 13px 18px; border-radius: 999px; font-weight: 600; font-size: 13.5px;
      margin-top: 12px; transition: background .15s;
    }
    .wa-btn:hover { background: #128C7E; }
    .map-link {
      display: flex; align-items: center; gap: 7px;
      background: var(--cream-d); color: var(--cam-primary);
      text-decoration: none; padding: 10px 14px;
      border-radius: 10px; font-weight: 600; font-size: 12.5px;
      border: 1px solid var(--line); margin-top: 10px; transition: background .15s;
    }
    .map-link:hover { background: var(--sand-l); }
    .alo-btn {
      display: flex; align-items: center; gap: 12px;
      background: linear-gradient(135deg, var(--cam-dark), var(--cam-primary));
      color: #fff; text-decoration: none;
      padding: 14px 18px; border-radius: 16px;
      margin-top: 12px; transition: opacity .18s;
    }
    .alo-btn:hover { opacity: .9; }
    .alo-icon {
      width: 42px; height: 42px; background: rgba(255,255,255,.15);
      border-radius: 10px; display: flex; align-items: center; justify-content: center; flex-shrink: 0;
    }
    .alo-text strong { display: block; font-size: 14px; font-weight: 600; }
    .alo-text span { font-size: 11.5px; opacity: .75; }

    /* Orari grid */
    .times-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin: 10px 0; }

    /* Separatore sezione */
    .section-sep { font-size: 9px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--cam-primary); opacity: .7; margin: 14px 0 8px; }

    /* ===== FASCIA PAVIMENTO ===== */
    .floor-band {
      width: 100%;
      height: 56px;
      overflow: hidden;
      display: block;
      flex-shrink: 0;
      position: relative;
    }
    .floor-band svg {
      width: 100%;
      height: 100%;
      display: block;
    }
    .floor-band::after {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(to bottom, rgba(0,0,0,.28) 0%, rgba(0,0,0,.05) 100%);
      pointer-events: none;
    }

    /* Footer */
    .footer {
      text-align: center; padding: 24px 20px 36px;
      color: var(--muted); font-size: 12px; line-height: 1.7;
      border-top: 1px solid var(--line); margin-top: 18px;
    }
    .footer strong { color: var(--brown); }

    /* Guest banner quando non c'è camera */
    .no-cam-banner {
      background: var(--brown-d); color: rgba(255,255,255,.8);
      padding: 12px 20px; font-size: 12px; text-align: center; line-height: 1.5;
    }

    /* ===== FASCIA PAVIMENTO ===== */
    .floor-band {
      width: 100%;
      height: 60px;
      overflow: hidden;
      position: relative;
      display: block;
      flex-shrink: 0;
    }
    .floor-band svg {
      width: 100%;
      height: 100%;
      display: block;
    }
    .floor-band::after {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(to bottom, rgba(0,0,0,.18) 0%, transparent 100%);
      pointer-events: none;
    }
  </style>
</head>
<body>

<div id="app"></div>

<script>
// ===== CONFIGURAZIONE CAMERE =====
var CAM_CONFIG = {
  '1954': {
    primary: '#5C7A5C',   // verde salvia
    dark:    '#3A5C3A',
    light:   '#E8F0E8',
    mid:     '#A8C4A8',
    rgb:     '92,122,92',
    floor:   { it:'1° Piano', en:'1st Floor', fr:'1er Étage', de:'1. Stock', es:'1ª Planta' },
  },
  '1956': {
    primary: '#3A5F7A',   // blu acciaio
    dark:    '#1E3D52',
    light:   '#E0EBF2',
    mid:     '#8EB4CB',
    rgb:     '58,95,122',
    floor:   { it:'2° Piano', en:'2nd Floor', fr:'2ème Étage', de:'2. Stock', es:'2ª Planta' },
  },
  '1920': {
    primary: '#8C6D2F',   // ocra dorata
    dark:    '#5C4510',
    light:   '#F5ECD4',
    mid:     '#D4B06A',
    rgb:     '140,109,47',
    floor:   { it:'Piano Terra', en:'Ground Floor', fr:'Rez-de-chaussée', de:'Erdgeschoss', es:'Planta Baja' },
  },
};

// ===== PARAMS URL =====
var qs = new URLSearchParams(location.search);
var guestNome    = qs.get('nome') || '';
var guestCamera  = qs.get('camera') || '';
var guestArrivo  = qs.get('arrivo') || '';
var guestPartenza = qs.get('partenza') || '';
var camNum = guestCamera.replace('Camera ','').trim();
var camCfg = CAM_CONFIG[camNum] || CAM_CONFIG['1954'];

// Applica colori camera ai CSS vars
var root = document.documentElement;
root.style.setProperty('--cam-primary', camCfg.primary);
root.style.setProperty('--cam-dark',    camCfg.dark);
root.style.setProperty('--cam-light',   camCfg.light);
root.style.setProperty('--cam-mid',     camCfg.mid);
root.style.setProperty('--cam-rgb',     camCfg.rgb);

// ===== LINGUA =====
var currentLang = 'it';
try { currentLang = localStorage.getItem('santalo_guest_lang') || 'it'; } catch(e) {}

function t(obj) {
  if (typeof obj === 'string') return obj;
  return obj[currentLang] || obj['it'] || obj['en'] || '';
}

function fmtDate(iso, lang) {
  if (!iso) return '';
  var l = lang || currentLang;
  var d = new Date(iso + 'T12:00:00');
  var locales = { it:'it-IT', en:'en-GB', fr:'fr-FR', de:'de-DE', es:'es-ES' };
  return d.toLocaleDateString(locales[l]||'it-IT', {day:'numeric', month:'short'});
}

// ===== RENDER PRINCIPALE =====
function render() {
  var L = currentLang;
  var cfg = camCfg;
  var floorLabel = t(cfg.floor);

  var guestFirstName = guestNome ? guestNome.split(' ')[0] : '';

  var heroContent = '';
  if (camNum) {
    heroContent = '<div class="hero" id="hero-el">' +
      '<div class="hero-bg-year">' + camNum + '</div>' +
      '<div class="hero-content">' +
      '<div class="hero-logo-wrap">' +
      '<div class="hero-logo"><img src="https://fdp88.github.io/SANTALO/santalo-logo.png" alt="Santalò"/></div>' +
      '<div class="hero-bb">Santalò B&amp;B · Bitonto</div>' +
      '</div>' +
      '<div class="hero-year">' + camNum + '</div>' +
      '<div class="hero-floor">' + floorLabel + '</div>' +
      (guestFirstName ? '<div class="hero-guest-pill"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>' + t({it:'Ciao', en:'Hi', fr:'Bonjour', de:'Hallo', es:'Hola'}) + ' ' + guestFirstName + '</div>' : '') +
      (guestArrivo || guestPartenza ? '<div class="hero-dates">' +
        (guestArrivo ? '<div class="hero-date-chip"><span>' + t({it:'arrivo',en:'check-in',fr:'arrivée',de:'Ankunft',es:'llegada'}) + '</span>' + fmtDate(guestArrivo) + '</div>' : '') +
        (guestPartenza ? '<div class="hero-date-chip"><span>' + t({it:'partenza',en:'check-out',fr:'départ',de:'Abreise',es:'salida'}) + '</span>' + fmtDate(guestPartenza) + '</div>' : '') +
        '</div>' : '') +
      '</div>' +
      '</div>' +
      '<div class="quick-times">' +
      '<div class="qt-item"><div class="qt-label">Check-in</div><div class="qt-value">15:00</div></div>' +
      '<div class="qt-item"><div class="qt-label">Check-out</div><div class="qt-value">10:00</div></div>' +
      '<div class="qt-item"><div class="qt-label">' + t({it:'Silenzio',en:'Quiet',fr:'Silence',de:'Ruhe',es:'Silencio'}) + '</div><div class="qt-value">22–8</div></div>' +
      '</div>';
  } else {
    heroContent = '<div class="no-cam-banner">' + t({it:'Apri questo link dal messaggio di benvenuto per vedere le istruzioni della tua camera.',en:'Open this link from your welcome message to see your room instructions.',fr:'Ouvrez ce lien depuis votre message de bienvenue.',de:'Öffnen Sie diesen Link aus Ihrer Willkommensnachricht.',es:'Abre este enlace desde tu mensaje de bienvenida.'}) + '</div>';
  }

  // Fascia pavimento cotto — mostrata solo se c'è camera
  var floorBand = camNum ? '<div class="floor-band">' +
    '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 56" preserveAspectRatio="xMidYMid slice">' +
    '<defs><pattern id="fp" x="0" y="0" width="80" height="56" patternUnits="userSpaceOnUse">' +
    // Tile: quadrato 80x56 diviso in 8 triangoli (4 coppie)
    '<polygon points="0,0 40,0 20,28" fill="#5C3820"/>' +
    '<polygon points="40,0 80,0 60,28" fill="#C9896A"/>' +
    '<polygon points="80,0 80,56 60,28" fill="#8B6040"/>' +
    '<polygon points="80,56 40,56 60,28" fill="#A85A35"/>' +
    '<polygon points="40,56 0,56 20,28" fill="#D4B490"/>' +
    '<polygon points="0,56 0,0 20,28" fill="#A85A35"/>' +
    '<polygon points="40,0 80,56 40,56" fill="#5C3820"/>' +
    '<polygon points="0,56 40,0 40,56" fill="#C9896A"/>' +
    '</pattern></defs>' +
    '<rect width="800" height="56" fill="url(#fp)"/>' +
    '<rect width="800" height="56" fill="linear-gradient(to bottom, rgba(0,0,0,.22) 0%, transparent 70%)" opacity="0.4"/>' +
    '</svg>' +
    '</div>' : '';

  var langBar = '<div class="lang-bar">' +
    ['it','en','fr','de','es'].map(function(l) {
      var flags = {it:'🇮🇹 IT', en:'🇬🇧 EN', fr:'🇫🇷 FR', de:'🇩🇪 DE', es:'🇪🇸 ES'};
      return '<button class="lang-btn' + (l===L?' active':'') + '" onclick="setLang(\'' + l + '\')">' + flags[l] + '</button>';
    }).join('') +
    '</div>';

  var hint = '<div class="section-hint">' + t({it:'TOCCA UN\'ICONA',en:'TAP AN ICON',fr:'TOUCHEZ UNE ICÔNE',de:'TIPPEN SIE',es:'TOCA UN ICONO'}) + '</div>';

  var icons = [
    { id:'accesso',    svg:'<path d="M21 2l-2 2m-7.61 7.61a5.5 5.5 0 1 1-7.778 7.778 5.5 5.5 0 0 1 7.777-7.777zm0 0L15.5 7.5m0 0l3 3L22 7l-3-3m-3.5 3.5L19 4"/>',
      label:{it:'COME ENTRARE',en:'HOW TO ENTER',fr:'COMMENT ENTRER',de:'ZUGANG',es:'CÓMO ENTRAR'} },

var activePanel = null;

function togglePanel(id) {
  document.querySelectorAll('.icon-card').forEach(function(c){ c.classList.remove('active'); });
  var panel = document.getElementById('contentPanel');
  if (activePanel === id) { panel.style.display='none'; activePanel=null; return; }
  activePanel = id;
  document.getElementById('card-'+id).classList.add('active');
  panel.style.display = 'block';
  panel.innerHTML = buildPanel(id);
  setTimeout(function(){ panel.scrollIntoView({behavior:'smooth',block:'nearest'}); }, 60);
}

function closePanel() {
  document.getElementById('contentPanel').style.display='none';
  document.querySelectorAll('.icon-card').forEach(function(c){ c.classList.remove('active'); });
  activePanel = null;
}

function mapLink(url, label) {

function copyText(txt, btnId) {
  navigator.clipboard.writeText(txt).then(function() {
    var b = document.getElementById(btnId);
    if (b) { var old = b.textContent; b.textContent = '✓ OK'; b.classList.add('copied');
      setTimeout(function(){ b.textContent = old; b.classList.remove('copied'); }, 2000); }
  }).catch(function(){});
}
