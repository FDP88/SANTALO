<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Alò — Santalò B&B</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --brown: #6B2D1F;
      --brown-d: #3d1a10;
      --brown-l: #8C4F35;
      --sand: #C4A882;
      --sand-l: #E8D9C0;
      --sand-ll: #F5EDE0;
      --cream: #FAF7F2;
      --cream-d: #F3EBE2;
      --ink: #2E241F;
      --muted: #7A6B61;
      --line: rgba(107,45,31,.13);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html {
      height: 100%;
      height: -webkit-fill-available;
    }
    body {
      font-family: 'DM Sans', system-ui, sans-serif;
      background: var(--cream);
      color: var(--ink);
      display: flex;
      flex-direction: column;
      min-height: 100%;
      min-height: -webkit-fill-available;
      height: 100dvh;
      overflow: hidden;
    }

    /* HEADER */
    .header {
      background: var(--brown-d);
      color: #fff;
      padding: 14px 18px;
      display: flex;
      align-items: center;
      gap: 14px;
      flex-shrink: 0;
      border-bottom: 1px solid rgba(255,255,255,.08);
    }
    .header-logo {
      width: 42px;
      height: 42px;
      border-radius: 10px;
      background: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      flex-shrink: 0;
    }
    .header-logo img {
      width: 36px;
      height: 36px;
      object-fit: contain;
    }
    .header-info { flex: 1; }
    .header-name {
      font-family: 'Cormorant Garamond', serif;
      font-size: 1.3rem;
      font-weight: 600;
      line-height: 1.1;
      letter-spacing: .01em;
    }
    .header-name span {
      color: var(--sand);
    }
    .header-sub {
      font-size: 0.7rem;
      opacity: 0.65;
      margin-top: 2px;
      display: flex;
      align-items: center;
      gap: 5px;
    }
    .dot-live {
      width: 6px; height: 6px;
      border-radius: 50%;
      background: #4ade80;
      animation: pulse 2s infinite;
    }
    @keyframes pulse { 0%,100%{opacity:1}50%{opacity:.35} }

    /* BANNER OSPITE */
    .guest-banner {
      background: linear-gradient(135deg, #f5ede6, #ede0d0);
      border-bottom: 1px solid var(--line);
      padding: 9px 18px;
      font-size: 12.5px;
      color: var(--brown-d);
      display: flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
    }
    .guest-banner.hidden { display: none; }
    .guest-banner strong { font-weight: 600; }

    /* MESSAGGI */
    .messages {
      flex: 1;
      overflow-y: auto;
      padding: 18px 14px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      scroll-behavior: smooth;
    }
    .messages::-webkit-scrollbar { width: 3px; }
    .messages::-webkit-scrollbar-thumb { background: var(--sand-l); border-radius: 4px; }

    .msg { display: flex; gap: 9px; max-width: 90%; animation: fadeUp .22s ease; }
    @keyframes fadeUp { from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:translateY(0)} }
    .msg.bot { align-self: flex-start; }
    .msg.user { align-self: flex-end; flex-direction: row-reverse; }

    .msg-avatar {
      width: 32px; height: 32px;
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: .85rem;
      flex-shrink: 0;
      margin-top: 2px;
      overflow: hidden;
    }
    .msg.bot .msg-avatar {
      background: var(--brown-d);
      padding: 4px;
    }
    .msg.bot .msg-avatar img {
      width: 130%; height: 130%;
      object-fit: cover;
      margin: -15%;
    }
    .msg.user .msg-avatar {
      background: var(--cream-d);
      border: 1.5px solid var(--line);
      font-size: 1rem;
    }

    .msg-bubble {
      padding: 10px 14px;
      border-radius: 17px;
      font-size: 14px;
      line-height: 1.65;
      max-width: 100%;
      word-break: break-word;
    }
    .msg.bot .msg-bubble {
      background: #fff;
      border: 1px solid var(--line);
      border-bottom-left-radius: 4px;
      box-shadow: 0 2px 8px rgba(58,30,18,.05);
    }
    .msg.user .msg-bubble {
      background: var(--brown);
      color: #fff;
      border-bottom-right-radius: 4px;
    }
    .msg.bot .msg-bubble strong { color: var(--brown); font-weight: 600; }

    /* QUICK BUTTONS */
    .quick-btns {
      display: flex; flex-wrap: wrap; gap: 6px;
      padding: 2px 0 2px 41px;
      animation: fadeUp .3s ease .1s both;
    }
    .quick-btn {
      background: #fff;
      border: 1.5px solid var(--sand);
      border-radius: 999px;
      padding: 6px 13px;
      font-family: 'DM Sans', sans-serif;
      font-size: 12.5px;
      font-weight: 500;
      color: var(--brown);
      cursor: pointer;
      transition: all .17s;
    }
    .quick-btn:hover { background: var(--brown); color: #fff; border-color: var(--brown); }

    /* TYPING */
    .typing { display: flex; gap: 9px; align-items: flex-end; align-self: flex-start; }
    .typing-bubble {
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 17px; border-bottom-left-radius: 4px;
      padding: 11px 14px;
      display: flex; gap: 5px; align-items: center;
      box-shadow: 0 2px 8px rgba(58,30,18,.05);
    }
    .typing-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--sand); animation: bounce .9s infinite; }
    .typing-dot:nth-child(2){animation-delay:.15s} .typing-dot:nth-child(3){animation-delay:.3s}
    @keyframes bounce{0%,80%,100%{transform:translateY(0)}40%{transform:translateY(-5px)}}

    /* WHATSAPP BTN */
    .wa-btn {
      display: inline-flex; align-items: center; gap: 6px;
      margin-top: 9px; margin-right: 6px;
      background: #25D366; color: #fff !important;
      border: none; border-radius: 999px;
      padding: 8px 15px;
      font-family: 'DM Sans', sans-serif;
      font-size: 12.5px; font-weight: 500;
      cursor: pointer; text-decoration: none;
      transition: background .18s;
    }
    .wa-btn:hover { background: #128C7E; }

    /* INTRO CARD */
    .intro-card {
      background: linear-gradient(135deg, var(--brown-d), var(--brown-l));
      border-radius: 16px;
      padding: 20px;
      margin: 4px 0 8px;
      color: #fff;
      display: flex;
      align-items: center;
      gap: 16px;
    }
    .intro-card-logo {
      width: 56px; height: 56px;
      background: rgba(255,255,255,.92);
      border-radius: 14px;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
    }
    .intro-card-logo img {
      width: 130%; height: 130%;
      object-fit: cover;
      margin: -15%;
    }
    .intro-card-text h2 {
      font-family: 'Cormorant Garamond', serif;
      font-size: 1.4rem;
      font-weight: 600;
      margin-bottom: 4px;
    }
    .intro-card-text h2 span { color: var(--sand-l); }
    .intro-card-text p { font-size: .8rem; opacity: .75; line-height: 1.5; }

    /* INPUT */
    .input-area { padding: 10px 13px 14px; background: #fff; border-top: 1px solid var(--line); flex-shrink: 0; }
    .input-row {
      display: flex; gap: 8px; align-items: flex-end;
      background: var(--cream); border: 1.5px solid var(--line);
      border-radius: 22px; padding: 7px 7px 7px 13px;
      transition: border-color .2s;
    }
    .input-row:focus-within { border-color: var(--brown); }
    #userInput {
      flex: 1; border: none; background: transparent;
      font-family: 'DM Sans', sans-serif; font-size: 14px;
      color: var(--ink); resize: none; outline: none;
      max-height: 100px; min-height: 22px; line-height: 1.5; padding: 0;
    }
    #userInput::placeholder { color: var(--muted); }
    #sendBtn {
      width: 37px; height: 37px; border-radius: 50%; border: none;
      background: var(--brown); color: #fff; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0; transition: all .17s;
    }
    #sendBtn:hover { background: var(--brown-l); }
    #sendBtn:disabled { background: var(--sand-l); cursor: not-allowed; }
    #sendBtn svg { width: 16px; height: 16px; }
    .input-hint { font-size: 10px; color: var(--muted); text-align: center; margin-top: 7px; opacity: 0.65; }

    /* LANG SELECTOR */
    .lang-selector {
      display: flex; gap: 5px; flex-shrink: 0;
    }
    .lang-flag {
      background: none; border: none; cursor: pointer;
      font-size: 1.2rem; padding: 3px 4px; border-radius: 6px;
      opacity: 0.5; transition: opacity .15s, transform .15s;
      line-height: 1;
    }
    .lang-flag.active { opacity: 1; transform: scale(1.15); }
    .lang-flag:hover { opacity: 0.85; }

    .chat-wrap {
      display: flex;
      flex-direction: column;
      flex: 1;
      overflow: hidden;
      width: 100%;
    }
    @media (min-width: 600px) {
      body { background: var(--cream-d); align-items: center; justify-content: center; }
      .chat-wrap { width: 100%; max-width: 460px; height: min(800px, 95dvh); flex: none; border-radius: 22px; overflow: hidden; box-shadow: 0 8px 40px rgba(58,30,18,.15), 0 32px 80px rgba(58,30,18,.12); }
    }
  </style>
</head>
<body>
<div class="chat-wrap">

  <div class="header">
    <div class="header-logo">
      <img src="https://fdp88.github.io/SANTALO/santalo-logo.png" alt="Santalò"/>
    </div>
    <div class="header-info">
      <div class="header-name">Al<span>ò</span></div>
      <div class="header-sub">
        <span class="dot-live"></span>
        <span id="headerSub">Assistente Santalò B&B · H24</span>
      </div>
    </div>
    <div class="lang-selector">
      <button class="lang-flag active" data-lang="it" title="Italiano">🇮🇹</button>
      <button class="lang-flag" data-lang="en" title="English">🇬🇧</button>
      <button class="lang-flag" data-lang="fr" title="Français">🇫🇷</button>
      <button class="lang-flag" data-lang="de" title="Deutsch">🇩🇪</button>
      <button class="lang-flag" data-lang="es" title="Español">🇪🇸</button>
    </div>
  </div>

  <div class="guest-banner hidden" id="guestBanner">
    <span>&#127974;</span>
    <span id="guestBannerText"></span>
  </div>

  <div class="messages" id="messages"></div>

  <div class="input-area">
    <div class="input-row">
      <textarea id="userInput" placeholder="Scrivi ad Alò..." rows="1"></textarea>
      <button id="sendBtn" aria-label="Invia">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="22" y1="2" x2="11" y2="13"></line>
          <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
        </svg>
      </button>
    </div>
    <div class="input-hint">Puoi scrivere in italiano, inglese o qualsiasi altra lingua</div>
  </div>

</div>

<script>
var CFG = {
  workerUrl: 'https://santalo-bot.giuseppe-acquafredda.workers.dev/',
  knowledgeUrl: 'https://fdp88.github.io/SANTALO/santalo-knowledge.json',
  whatsapp_giuseppe: '393336410329',
  whatsapp_dario: '393272243207',
  supabaseUrl: 'https://ifdqcnjdnblvtflqsqmt.supabase.co',
  supabaseKey: 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImlmZHFjbmpkbmJsdnRmbHFzcW10Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzM4NDUzNzksImV4cCI6MjA4OTQyMTM3OX0.VXc_vQBH8I4BP7DQNDjBnQ0LsRAUigYu4-_yCwHGF5w'
};

var kb = null, pren = null, chatHistory = [], isWaiting = false, systemPrompt = '';

function urlParams() {
  var p = new URLSearchParams(location.search);
  return { id: p.get('prenotazione_id'), nome: p.get('nome'), camera: p.get('camera'), arrivo: p.get('arrivo'), partenza: p.get('partenza') };
}

function loadKB() {
  return fetch(CFG.knowledgeUrl + '?_=' + Date.now())
    .then(function(r) { if (r.ok) return r.json(); })
    .then(function(data) { if (data) kb = data; })
    .catch(function() {});
}

function loadPren(id) {
  return fetch(CFG.supabaseUrl + '/rest/v1/prenotazioni?id=eq.' + id + '&select=*', {
    headers: { apikey: CFG.supabaseKey, Authorization: 'Bearer ' + CFG.supabaseKey }
  }).then(function(r) { if (r.ok) return r.json(); })
    .then(function(d) { return d && d[0] ? d[0] : null; })
    .catch(function() { return null; });
}

function buildPrompt(kb, pren) {
  var g = kb || {};

  // Legge tutto dal knowledge base JSON
  var camere = g.camere || {};
  var wifi = g.wifi || { rete:'B&B_santalo', password:'acq2024!' };
  var orari = g.orari || { checkin:'dalle 15:00', checkout:'entro le 10:00' };
  var parcheggio = g.parcheggio || {};
  var struttura = g.struttura || {};
  var servizi = g.servizi || {};
  var colazione = servizi.colazione || {};
  var elettricita = g.elettricita || {};
  var riscaldamento = g.riscaldamento_raffrescamento || {};
  var condizionatore = riscaldamento.condizionatore || {};
  var cronotermostato = riscaldamento.cronotermostato || {};
  var dove_mangiare = g.dove_mangiare || {};
  var cosa_vedere = g.cosa_vedere_bitonto || {};
  var dintorni = g.dintorni || {};
  var trasporti = g.trasporti || {};
  var farmacie = g.farmacie || {};
  var raccolta = g.raccolta_differenziata || {};
  var regole = g.regole_casa || {};

  // Sezione ospite
  var guestSection = '';
  if (pren && pren.nome) {
    var nome1 = pren.nome.split(' ')[0];
    var cam = String(pren.camera || '').replace('Camera ', '');
    var ci = camere[cam] || {};
    guestSection = '\n## OSPITE IDENTIFICATO\n' +
      'Nome: ' + pren.nome + ' (chiamalo ' + nome1 + ')\n' +
      'Camera: ' + cam + (ci.piano ? ' - ' + ci.piano : '') + '\n' +
      'Arrivo: ' + (pren.arrivo||'n.d.') + ' | Partenza: ' + (pren.partenza||'n.d.') + '\n' +
      'Istruzioni accesso: ' + (ci.istruzioni||'') + '\n' +
      'Codice: ' + (ci.codice||'') + '\n' +
      'Checkout: ' + (ci.checkout||'') + '\n' +
      'USA QUESTE INFO senza che l\'ospite le chieda.\n';
  } else {
    guestSection = '\n## OSPITE NON IDENTIFICATO\n' +
      'NON fornire codici di accesso o istruzioni di entrata.\n' +
      'Rispondi esattamente: "Per motivi di sicurezza i codici di accesso vengono forniti solo tramite il link personalizzato che ricevi su WhatsApp. Usa i pulsanti qui sotto per contattarci."\n' +
      'NON scrivere numeri di telefono o link nel testo.\n' +
      'Puoi rispondere a domande generali: WiFi, parcheggio, orari, ristoranti, trasporti, cosa vedere.\n';
  }

  // Ristoranti dal JSON
  var ristStr = (dove_mangiare.ristoranti || []).map(function(r) {
    return '- ' + r.nome + ': ' + r.tipo + (r.nota ? ' (' + r.nota + ')' : '');
  }).join('\n');

  // Attrazioni dal JSON
  var attrazioniStr = (cosa_vedere.attrazioni || []).map(function(a) {
    return '- ' + a.nome + ': ' + a.descrizione;
  }).join('\n');

  // Dintorni dal JSON
  var dintorniStr = (dintorni.destinazioni || []).map(function(d) {
    return '- ' + d.nome + ': ' + d.distanza + (d.note ? ' — ' + d.note : '');
  }).join('\n');

  // Spiagge dal JSON
  var spiaggeStr = (dintorni.spiagge || []).map(function(s) {
    return '- ' + s.nome + ': ' + s.distanza;
  }).join('\n');

  // FAQ dal JSON
  var faqStr = (g.faq || []).map(function(f) {
    return 'D: ' + f.domanda + '\nR: ' + f.risposta;
  }).join('\n\n');

  // Farmacie dal JSON
  var farmacieStr = (farmacie.elenco || []).slice(0,3).map(function(f) {
    return '- ' + f.nome + ' (' + f.indirizzo + ') tel. ' + f.telefono;
  }).join('\n');

  // Taxi dal JSON
  var taxiStr = '';
  if (trasporti.taxi && trasporti.taxi.contatti) {
    taxiStr = trasporti.taxi.contatti.slice(0,3).map(function(t) {
      return '- ' + (t.nome||t.zona||'') + ': ' + t.telefono;
    }).join('\n');
  }

  return 'REGOLA ASSOLUTA: Rispondi SEMPRE nella stessa lingua usata dall\'ospite. Italiano, inglese, francese, tedesco, spagnolo — adattati sempre. Questa regola ha priorità su tutto.\n\n' +
    'Sei Alò, l\'assistente virtuale di Santalò B&B a Bitonto, Puglia. Tono: caldo, cordiale, leggero. Sii conciso (max 180 parole). Usa emoji con moderazione.' +
    guestSection +
    '\n## STRUTTURA\n' +
    'Indirizzo: ' + (struttura.indirizzo || 'Vico Storto Sant\'Eligio 9, 70032 Bitonto (BA)') + '\n' +
    'Maps: ' + (struttura.google_maps || 'https://maps.app.goo.gl/QCtQxhaD7NkAdyVj8') + '\n' +
    'Email: ' + (struttura.email || 'info@bebsantalo.it') + '\n\n' +
    '## WIFI\nRete: ' + wifi.rete + ' | Password: ' + wifi.password + '\n\n' +
    '## ORARI\n' +
    'Check-in: ' + orari.checkin + '\n' +
    'Check-out: ' + orari.checkout + '\n' +
    'Silenzio notturno: ' + (orari.silenzio_notturno || '22:00 - 8:00') + '\n' +
    'Silenzio pomeridiano: ' + (orari.silenzio_pomeridiano || '14:00 - 16:30') + '\n\n' +
    '## PARCHEGGIO\n' +
    (parcheggio.info || '') + '\n' +
    'Punto più vicino: ' + (parcheggio.punto_piu_vicino || '') + '\n' +
    'Strisce blu: ' + (parcheggio.strisce_blu || '') + '\n' +
    'Strisce bianche: ' + (parcheggio.strisce_bianche || 'gratuite') + '\n' +
    'Garage: ' + (parcheggio.garage || '') + '\n\n' +
    '## COLAZIONE\n' +
    'Disponibile su richiesta: ' + (colazione.costo || '5€/persona') + '\n' +
    'Dove: ' + (colazione.dove || 'Mazzini Place') + '\n' +
    'Modalità: ' + (colazione.modalita || 'comunicare la sera prima') + '\n\n' +
    '## CONDIZIONATORE\n' +
    (condizionatore.descrizione || '') + '\n' +
    (condizionatore.istruzioni || '') + '\n' +
    'Se non funziona: ' + (condizionatore.se_non_funziona || '') + '\n\n' +
    '## CRONOTERMOSTATO (Seitron Freetime Evo)\n' +
    'Posizione: ' + (cronotermostato.posizione || 'accanto al lavandino') + '\n' +
    (cronotermostato.istruzioni_brevi || '') + '\n' +
    (cronotermostato.se_non_funziona || '') + '\n\n' +
    '## ELETTRICITÀ\n' +
    (elettricita.descrizione || '') + '\n' +
    (elettricita.istruzioni || '') + '\n\n' +
    '## PULIZIA E BIANCHERIA\n' +
    'Pulizia giornaliera: ' + (servizi.pulizia && servizi.pulizia.su_richiesta || '15€ su richiesta') + '\n' +
    'Cambio biancheria: ' + (servizi.pulizia && servizi.pulizia.biancheria || '8€ su richiesta') + '\n\n' +
    '## RACCOLTA DIFFERENZIATA\n' +
    (raccolta.descrizione || '') + '\n' +
    'Calendario: Umido lun/mer/sab | Plastica mar | Secco gio | Vetro 1° ven | Carta 2°-4° ven\n' +
    'Per dubbi: ' + (raccolta.riciclario || 'sanbspa.it/riciclario') + '\n\n' +
    '## DOVE MANGIARE\n' + ristStr + '\n' +
    'Panificio: ' + (dove_mangiare.panificio || '') + '\n\n' +
    '## COSA VEDERE A BITONTO\n' + attrazioniStr + '\n\n' +
    '## DINTORNI\n' + dintorniStr + '\n\n' +
    '## SPIAGGE VICINE\n' + spiaggeStr + '\n\n' +
    '## TRASPORTI\n' +
    'Aeroporto: ' + (trasporti.aeroporto || '') + '\n' +
    'Treno: ' + (trasporti.treno || '') + '\n' +
    'Taxi: ' + (trasporti.taxi && trasporti.taxi.info || '') + '\n' +
    (taxiStr ? 'Contatti taxi:\n' + taxiStr + '\n' : '') + '\n' +
    '## FARMACIE\n' + farmacieStr + '\n' +
    'Turni notturni/festivi: ' + (farmacie.turni || '') + '\n\n' +
    '## FAQ\n' + faqStr + '\n\n' +
    '## REGOLE RISPOSTA\n' +
    '- Rispondi SEMPRE nella lingua dell\'ospite\n' +
    '- Se non sai rispondere: "Non ho questa informazione — scrivi a info@bebsantalo.it"\n' +
    '- Per problemi urgenti suggerisci WhatsApp con Giuseppe o Dario\n' +
    '- Non inventare informazioni non presenti nel contesto';
}

var msgEl = document.getElementById('messages');
var inp = document.getElementById('userInput');
var btnEl = document.getElementById('sendBtn');

function scroll() { setTimeout(function() { msgEl.scrollTo({top: msgEl.scrollHeight, behavior: 'smooth'}); }, 50); }

function fmt(t) {
  return t.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>')
    .replace(/\*(.+?)\*/g,'<em>$1</em>')
    .replace(/\n/g,'<br>');
}

var LOGO_DATA = 'https://fdp88.github.io/SANTALO/santalo-logo.png';

function makeBotAvatar() {
  var av = document.createElement('div'); av.className = 'msg-avatar';
  var img = document.createElement('img');
  img.src = LOGO_DATA; img.alt = 'Alo';
  av.appendChild(img);
  return av;
}

function addMsg(role, text, extra) {
  var w = document.createElement('div'); w.className = 'msg ' + role;
  var av = role === 'bot' ? makeBotAvatar() : document.createElement('div');
  if (role !== 'bot') { av.className = 'msg-avatar'; av.innerHTML = '&#128100;'; }
  var bub = document.createElement('div'); bub.className = 'msg-bubble';
  bub.innerHTML = fmt(text);
  if (extra) { var e = document.createElement('div'); e.innerHTML = extra; bub.appendChild(e); }
  w.appendChild(av); w.appendChild(bub); msgEl.appendChild(w); scroll();
}

function addMsgHTML(role, html, extra) {
  var w = document.createElement('div'); w.className = 'msg ' + role;
  var av = role === 'bot' ? makeBotAvatar() : document.createElement('div');
  if (role !== 'bot') { av.className = 'msg-avatar'; av.innerHTML = '&#128100;'; }
  var bub = document.createElement('div'); bub.className = 'msg-bubble';
  bub.innerHTML = html;
  if (extra) { var e = document.createElement('div'); e.innerHTML = extra; bub.appendChild(e); }
  w.appendChild(av); w.appendChild(bub); msgEl.appendChild(w); scroll();
}

function showTyping() {
  var w = document.createElement('div'); w.className = 'typing'; w.id = 'typing';
  var av = document.createElement('div'); av.className = 'msg-avatar';
  av.style.cssText = 'background:var(--brown-d);padding:4px';
  var img = document.createElement('img');
  img.src = LOGO_DATA; img.alt = 'Alo';
  img.style.cssText = 'width:130%;height:130%;object-fit:cover;margin:-15%';
  av.appendChild(img);
  var b = document.createElement('div'); b.className = 'typing-bubble';
  b.innerHTML = '<div class="typing-dot"></div><div class="typing-dot"></div><div class="typing-dot"></div>';
  w.appendChild(av); w.appendChild(b); msgEl.appendChild(w); scroll();
}
function hideTyping() { var e = document.getElementById('typing'); if (e) e.remove(); }

function addQuick(labels) {
  var w = document.createElement('div'); w.className = 'quick-btns';
  labels.forEach(function(l) {
    var b = document.createElement('button'); b.className = 'quick-btn'; b.textContent = l;
    b.onclick = function() { w.remove(); send(l); };
    w.appendChild(b);
  });
  msgEl.appendChild(w); scroll();
}

function salvaMessaggio(ruolo, testo) {
  var params = urlParams();
  var nome = pren ? pren.nome : (params.nome || 'Ospite anonimo');
  var camera = pren ? pren.camera : (params.camera || '');
  var pren_id = pren ? (pren.id || params.id || '') : (params.id || '');
  fetch(CFG.supabaseUrl + '/rest/v1/conversazioni', {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json',
      'apikey': CFG.supabaseKey,
      'Authorization': 'Bearer ' + CFG.supabaseKey,
      'Prefer': 'return=minimal'
    },
    body: JSON.stringify({
      prenotazione_id: String(pren_id),
      nome_ospite: nome,
      camera: camera,
      ruolo: ruolo,
      messaggio: testo
    })
  }).catch(function() {});
}

function waLink(msg) {
  var txt = msg ? 'Ciao, sono un ospite del B&B Santalo. Ho bisogno di assistenza: ' + msg : 'Ciao, sono un ospite del B&B Santalo. Ho bisogno di assistenza.';
  return '<br><a href="https://wa.me/' + CFG.whatsapp_giuseppe + '?text=' + encodeURIComponent(txt) + '" target="_blank" class="wa-btn">' + WA_ICO + ' Giuseppe</a>' +
    '<a href="https://wa.me/' + CFG.whatsapp_dario + '?text=' + encodeURIComponent(txt) + '" target="_blank" class="wa-btn">' + WA_ICO + ' Dario</a>';
}

inp.addEventListener('input', function() { inp.style.height = 'auto'; inp.style.height = Math.min(inp.scrollHeight, 100) + 'px'; });
inp.addEventListener('keydown', function(e) { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); handleSend(); } });
btnEl.addEventListener('click', handleSend);

function handleSend() {
  var t = inp.value.trim();
  if (!t || isWaiting) return;
  inp.value = ''; inp.style.height = 'auto'; send(t);
}

function send(text) {
  if (isWaiting) return;
  document.querySelectorAll('.quick-btns').forEach(function(e) { e.remove(); });
  addMsg('user', text);
  chatHistory.push({role: 'user', content: text});
  isWaiting = true; btnEl.disabled = true; showTyping();

  fetch(CFG.workerUrl, {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({model: 'claude-sonnet-4-20250514', max_tokens: 1000, system: systemPrompt, messages: chatHistory})
  }).then(function(r) { return r.json(); })
    .then(function(data) {
      hideTyping();
      if (data.content && data.content[0] && data.content[0].text) {
        var reply = data.content[0].text;
        chatHistory.push({role: 'assistant', content: reply});
        var needsWA = /motivi di sicurezza|contatt[ai] (la struttura|il proprietario)|non ho questa informazione|pulsanti qui sotto/i.test(reply);
        addMsg('bot', reply, needsWA ? waLink(text) : null);
      } else {
        addMsg('bot', 'Si e\' verificato un problema tecnico. Riprova tra un momento.', waLink('Problema tecnico'));
      }
      isWaiting = false; btnEl.disabled = false; inp.focus();
    })
    .catch(function() {
      hideTyping();
      addMsg('bot', 'Connessione non disponibile al momento.', waLink());
      isWaiting = false; btnEl.disabled = false;
    });
}

var currentLang = 'it';

function setLang(lang) {
  if (!UI_LANGS[lang]) return;
  currentLang = lang;
  // Update buttons
  document.querySelectorAll('.lang-flag').forEach(function(btn) {
    btn.classList.toggle('active', btn.dataset.lang === lang);
  });
  // Update input placeholder and hint
  document.getElementById('userInput').placeholder = UI_LANGS[lang].placeholder;
  document.querySelector('.input-hint').textContent = UI_LANGS[lang].hint;
  document.getElementById('headerSub').textContent = UI_LANGS[lang].sub;
  // Save preference
  try { localStorage.setItem('santalo_chat_lang', lang); } catch(e) {}
}

// Bind lang buttons
document.querySelectorAll('.lang-flag').forEach(function(btn) {
