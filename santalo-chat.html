<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Santalò B&B — Assistente</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --brown: #6B2D1F; --brown-dark: #3d1a10; --brown-light: #8C4F35;
      --sand: #C4A882; --sand-light: #E8D9C0;
      --cream: #FAF7F2; --cream-dark: #F3EBE2;
      --ink: #2E241F; --muted: #7A6B61; --line: rgba(107,45,31,.13);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'DM Sans', system-ui, sans-serif; background: var(--cream); color: var(--ink); height: 100dvh; display: flex; flex-direction: column; overflow: hidden; }
    .header { background: linear-gradient(135deg, var(--brown-dark), var(--brown-light)); color: #fff; padding: 14px 18px; display: flex; align-items: center; gap: 12px; flex-shrink: 0; box-shadow: 0 2px 20px rgba(0,0,0,.2); }
    .header-icon { width: 44px; height: 44px; background: rgba(255,255,255,.15); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 1.3rem; flex-shrink: 0; }
    .header-name { font-family: 'Cormorant Garamond', serif; font-size: 1.2rem; font-weight: 600; line-height: 1.2; }
    .header-status { font-size: 0.7rem; opacity: 0.75; display: flex; align-items: center; gap: 5px; margin-top: 2px; }
    .status-dot { width: 7px; height: 7px; border-radius: 50%; background: #4ade80; animation: pulse 2s infinite; }
    @keyframes pulse { 0%,100%{opacity:1}50%{opacity:0.4} }
    .guest-banner { background: linear-gradient(135deg, #f5ede6, #efe5d8); border-bottom: 1px solid var(--line); padding: 9px 16px; display: flex; align-items: center; gap: 9px; font-size: 13px; color: var(--brown-dark); flex-shrink: 0; }
    .guest-banner.hidden { display: none; }
    .guest-banner strong { font-weight: 600; }
    .messages { flex: 1; overflow-y: auto; padding: 16px 13px; display: flex; flex-direction: column; gap: 11px; scroll-behavior: smooth; }
    .messages::-webkit-scrollbar { width: 3px; }
    .messages::-webkit-scrollbar-thumb { background: var(--sand-light); border-radius: 4px; }
    .msg { display: flex; gap: 8px; max-width: 90%; animation: fadeUp .22s ease; }
    @keyframes fadeUp { from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:translateY(0)} }
    .msg.bot { align-self: flex-start; }
    .msg.user { align-self: flex-end; flex-direction: row-reverse; }
    .msg-avatar { width: 31px; height: 31px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: .9rem; flex-shrink: 0; margin-top: 2px; }
    .msg.bot .msg-avatar { background: var(--brown); color: #fff; }
    .msg.user .msg-avatar { background: var(--cream-dark); border: 1.5px solid var(--line); }
    .msg-bubble { padding: 10px 13px; border-radius: 17px; font-size: 14px; line-height: 1.65; max-width: 100%; word-break: break-word; }
    .msg.bot .msg-bubble { background: #fff; border: 1px solid var(--line); border-bottom-left-radius: 4px; box-shadow: 0 2px 8px rgba(58,30,18,.06); }
    .msg.user .msg-bubble { background: var(--brown); color: #fff; border-bottom-right-radius: 4px; }
    .msg.bot .msg-bubble strong { color: var(--brown); font-weight: 600; }
    .quick-btns { display: flex; flex-wrap: wrap; gap: 6px; padding: 2px 0 2px 39px; animation: fadeUp .3s ease .1s both; }
    .quick-btn { background: #fff; border: 1.5px solid var(--sand); border-radius: 999px; padding: 6px 12px; font-family: 'DM Sans', sans-serif; font-size: 12px; font-weight: 500; color: var(--brown); cursor: pointer; transition: all .17s; }
    .quick-btn:hover { background: var(--brown); color: #fff; border-color: var(--brown); }
    .typing { display: flex; gap: 8px; align-items: flex-end; align-self: flex-start; }
    .typing-bubble { background: #fff; border: 1px solid var(--line); border-radius: 17px; border-bottom-left-radius: 4px; padding: 11px 14px; display: flex; gap: 5px; align-items: center; box-shadow: 0 2px 8px rgba(58,30,18,.06); }
    .typing-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--sand); animation: bounce .9s infinite; }
    .typing-dot:nth-child(2){animation-delay:.15s} .typing-dot:nth-child(3){animation-delay:.3s}
    @keyframes bounce{0%,80%,100%{transform:translateY(0)}40%{transform:translateY(-5px)}}
    .wa-btn { display: inline-flex; align-items: center; gap: 6px; margin-top: 9px; background: #25D366; color: #fff !important; border: none; border-radius: 999px; padding: 8px 15px; font-family: 'DM Sans', sans-serif; font-size: 12.5px; font-weight: 500; cursor: pointer; text-decoration: none; transition: background .18s; }
    .wa-btn:hover { background: #128C7E; }
    .input-area { padding: 10px 13px 14px; background: #fff; border-top: 1px solid var(--line); flex-shrink: 0; }
    .input-row { display: flex; gap: 8px; align-items: flex-end; background: var(--cream); border: 1.5px solid var(--line); border-radius: 22px; padding: 7px 7px 7px 13px; transition: border-color .2s; }
    .input-row:focus-within { border-color: var(--brown); }
    #userInput { flex: 1; border: none; background: transparent; font-family: 'DM Sans', sans-serif; font-size: 14px; color: var(--ink); resize: none; outline: none; max-height: 100px; min-height: 22px; line-height: 1.5; padding: 0; }
    #userInput::placeholder { color: var(--muted); }
    #sendBtn { width: 37px; height: 37px; border-radius: 50%; border: none; background: var(--brown); color: #fff; cursor: pointer; display: flex; align-items: center; justify-content: center; flex-shrink: 0; transition: all .17s; }
    #sendBtn:hover { background: var(--brown-light); }
    #sendBtn:disabled { background: var(--sand-light); cursor: not-allowed; }
    #sendBtn svg { width: 16px; height: 16px; }
    .input-hint { font-size: 10px; color: var(--muted); text-align: center; margin-top: 7px; opacity: 0.7; }
    @media (min-width: 600px) {
      body { background: var(--cream-dark); align-items: center; justify-content: center; flex-direction: row; }
      .chat-wrap { width: 100%; max-width: 460px; height: min(780px, 95dvh); border-radius: 22px; overflow: hidden; box-shadow: 0 8px 32px rgba(58,30,18,.10), 0 32px 80px rgba(58,30,18,.18); display: flex; flex-direction: column; }
    }
  </style>
</head>
<body>
<div class="chat-wrap">
  <div class="header">
    <div class="header-icon">🏡</div>
    <div>
      <div class="header-name">Santalò B&B — Assistente</div>
      <div class="header-status"><span class="status-dot"></span>Disponibile H24</div>
    </div>
  </div>
  <div class="guest-banner hidden" id="guestBanner">
    <span>🛎️</span>
    <span id="guestBannerText"></span>
  </div>
  <div class="messages" id="messages"></div>
  <div class="input-area">
    <div class="input-row">
      <textarea id="userInput" placeholder="Scrivi un messaggio…" rows="1"></textarea>
      <button id="sendBtn" aria-label="Invia">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
        </svg>
      </button>
    </div>
    <div class="input-hint">Puoi scrivere in italiano, inglese o qualsiasi altra lingua</div>
  </div>
</div>

<script>
// ─── CONFIGURAZIONE ────────────────────────────────────
const CFG = {
  workerUrl: 'https://santalo-bot.giuseppe-acquafredda.workers.dev/',
  knowledgeUrl: 'https://fdp88.github.io/SANTALO/santalo-knowledge.json',
  whatsapp_giuseppe: '393336410329',
  whatsapp_dario: '393272243207',
  supabaseUrl: 'https://ifdqcnjdnblvtflqsqmt.supabase.co',
  supabaseKey: 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImlmZHFjbmpkbmJsdnRmbHFzcW10Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzM4NDUzNzksImV4cCI6MjA4OTQyMTM3OX0.VXc_vQBH8I4BP7DQNDjBnQ0LsRAUigYu4-_yCwHGF5w'
};

// ─── STATO ─────────────────────────────────────────────
let kb = null, pren = null, history = [], isWaiting = false, systemPrompt = '';

// ─── URL PARAMS ────────────────────────────────────────
function urlParams() {
  const p = new URLSearchParams(location.search);
  return { id: p.get('prenotazione_id'), nome: p.get('nome'), camera: p.get('camera'), arrivo: p.get('arrivo'), partenza: p.get('partenza') };
}

// ─── CARICA KNOWLEDGE ──────────────────────────────────
async function loadKB() {
  try {
    const r = await fetch(CFG.knowledgeUrl + '?_=' + Date.now());
    if (r.ok) kb = await r.json();
  } catch(e) { console.log('KB fallback'); }
}

// ─── CARICA PRENOTAZIONE ───────────────────────────────
async function loadPren(id) {
  try {
    const r = await fetch(`${CFG.supabaseUrl}/rest/v1/prenotazioni?id=eq.${id}&select=*`,
      { headers: { apikey: CFG.supabaseKey, Authorization: `Bearer ${CFG.supabaseKey}` }});
    if (r.ok) { const d = await r.json(); return d[0] || null; }
  } catch(e) {}
  return null;
}

// ─── SYSTEM PROMPT ─────────────────────────────────────
function buildPrompt(kb, pren) {
  const g = (kb || {});
  const camere = g.camere || {
    '1920': { piano:'Piano terra', codice:'4660', istruzioni:'Inserisci 4660 sul key box, abbassa la leva, estrai la chiave, apri il portone.' },
    '1954': { piano:'Primo piano', codice:'43757', istruzioni:'Digita 43757 sul tastierino adiacente al portone, attendi il click, entra. Sala destra per le chiavi, poi scala al 1° piano a sinistra.' },
    '1956': { piano:'Secondo piano', codice:'43757', istruzioni:'Digita 43757 sul tastierino adiacente al portone, attendi il click, entra. Sala destra per le chiavi, poi scala al 2° piano a sinistra.' }
  };
  const wifi = g.wifi || { rete:'B&B_santalo', password:'acq2024!' };
  const orari = g.orari || { checkin:'dalle 14:00', checkout:'entro le 11:00' };

  let guestSection = '';
  if (pren && pren.nome) {
    const nome1 = pren.nome.split(' ')[0];
    const cam = pren.camera || '';
    const ci = camere[cam] || {};
    guestSection = `\n## OSPITE IDENTIFICATO\nNome: ${pren.nome} (chiamalo ${nome1})\nCamera: ${cam}${ci.piano ? ' - ' + ci.piano : ''}\nArrivo: ${pren.arrivo || 'n.d.'} | Partenza: ${pren.partenza || 'n.d.'}\nIstruzioni camera ${cam}: ${ci.istruzioni || ''}\nCodice: ${ci.codice || ''}\nUSA QUESTE INFO senza che l'ospite le chieda. Non chiedere quale camera ha.\n`;
  }

  const faqStr = (g.faq || []).map(f => `D: ${f.domanda}\nR: ${f.risposta}`).join('\n\n');
  const ristStr = ((g.dove_mangiare || {}).ristoranti || []).map(r => `- ${r.nome}: ${r.tipo}${r.nota ? ' ('+r.nota+')' : ''}`).join('\n');

  return `Sei l'assistente virtuale di Santalò B&B a Bitonto, Puglia. Tono: caldo, cordiale, professionale. Sii conciso (max 180 parole salvo istruzioni tecniche). Rispondi sempre nella lingua dell'ospite.
${guestSection}
## STRUTTURA
Indirizzo: ${(g.struttura||{}).indirizzo || 'Vico Storto Sant\'Eligio 9, 70032 Bitonto (BA)'}
Maps: https://maps.app.goo.gl/QCtQxhaD7NkAdyVj8
Email: info@bebsantalo.it

## ACCESSO CAMERE
1920 (piano terra): key box → codice 4660
1954 (1° piano): tastierino accanto al portone → codice 43757 → chiavi in sala destra → 1° piano sinistra
1956 (2° piano): tastierino accanto al portone → codice 43757 → chiavi in sala destra → 2° piano sinistra

## WIFI
Rete: ${wifi.rete} | Password: ${wifi.password}

## ORARI
Check-in: ${orari.checkin} | Check-out: ${orari.checkout}
Silenzio notturno: 22:00 - 8:00

## PARCHEGGIO
Centro storico = ZTL (no auto). Strisce blu in Piazza Cavour/Via Traiana (2-5 min a piedi). Posto auto privato su richiesta 10€/giorno.

## COLAZIONE
Non inclusa. Disponibile su richiesta: 5€/persona (comunicare la sera prima).

## CONDIZIONATORE (riscaldamento e raffrescamento)
Ogni camera ha un condizionatore che funziona d'estate (raffrescamento) e d'inverno (riscaldamento).
Le modalità sono già preimpostate per la stagione. Basta: 1) premere il tasto di accensione sul telecomando → 2) regolare la temperatura → 3) attendere alcuni minuti senza premere altri tasti.

## CRONOTERMOSTATO - Seitron Freetime Evo (termosifone)
Posizione: accanto al lavandino in camera.
Come usarlo: 1) Premi ON/OFF per accendere 2) Premi il tasto sole ☀ (Comfort) 3) Ruota la manopola sulla temperatura voluta 4) Premi la manopola o OK per confermare 5) Attendi 3-5 minuti (rileva temp ogni 3 min, è normale).
Problemi: Display "OFF" → premi ON/OFF. Freddo nonostante acceso → verifica che la temp impostata (☀) sia più alta di quella ambiente. Display "bAtt" → batterie scariche, contatta la struttura.

## RACCOLTA DIFFERENZIATA
Giallo: plastica/lattine | Verde: vetro | Blu: carta | Grigio: indifferenziata

## DOVE MANGIARE
${ristStr || 'Caveau (cucina pugliese), Il Patriarca (tradizionale), Vinicio (pesce), Ragno Verde (pizza storica), Manicaretto (panzerotto e asporto)'}

## COSA VEDERE
Bitonto: Cattedrale romanica XII sec, Castello Normanno, Museo Civico, Porta Baresana, Frantoio ipogeo
Dintorni: Bari 20 min | Castel del Monte 40 min | Polignano 35 min | Alberobello 1h | Matera 1h30

## TRASPORTI
Aeroporto Bari: 20 min auto. Treno: stazione Bitonto a 10 min a piedi → Bari Centrale 15-20 min.

## FAQ
${faqStr}

## REGOLE
- Se non conosci la risposta: "Non ho questa informazione — scrivi a info@bebsantalo.it"
- Per problemi urgenti/tecnici suggerisci di contattare il proprietario via WhatsApp
- Non inventare informazioni non presenti in questo prompt`;
}

// ─── DOM ───────────────────────────────────────────────
const msgEl = document.getElementById('messages');
const inp = document.getElementById('userInput');
const btn = document.getElementById('sendBtn');

function scroll() { setTimeout(() => msgEl.scrollTo({top:msgEl.scrollHeight,behavior:'smooth'}),50); }

function fmt(t) {
  return t.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
          .replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>').replace(/\*(.+?)\*/g,'<em>$1</em>').replace(/\n/g,'<br>');
}

function addMsg(role, text, extra) {
  const w = document.createElement('div'); w.className = 'msg ' + role;
  const av = document.createElement('div'); av.className = 'msg-avatar'; av.textContent = role==='bot'?'🏡':'👤';
  const bub = document.createElement('div'); bub.className = 'msg-bubble'; bub.innerHTML = fmt(text);
  if (extra) { const e=document.createElement('div'); e.innerHTML=extra; bub.appendChild(e); }
  w.appendChild(av); w.appendChild(bub); msgEl.appendChild(w); scroll();
}

function showTyping() {
  const w=document.createElement('div'); w.className='typing'; w.id='typing';
  const av=document.createElement('div'); av.className='msg-avatar'; av.style.cssText='background:var(--brown);color:#fff'; av.textContent='🏡';
  const b=document.createElement('div'); b.className='typing-bubble'; b.innerHTML='<div class="typing-dot"></div><div class="typing-dot"></div><div class="typing-dot"></div>';
  w.appendChild(av); w.appendChild(b); msgEl.appendChild(w); scroll();
}
function hideTyping() { const e=document.getElementById('typing'); if(e)e.remove(); }

function addQuick(labels) {
  const w=document.createElement('div'); w.className='quick-btns';
  labels.forEach(l=>{
    const b=document.createElement('button'); b.className='quick-btn'; b.textContent=l;
    b.onclick=()=>{ w.remove(); send(l); }; w.appendChild(b);
  });
  msgEl.appendChild(w); scroll();
}

function waLink(msg) {
  const txt = msg ? `Ciao, sono un ospite del B&B Santalò. Ho bisogno di assistenza: ${msg}` : 'Ciao, sono un ospite del B&B Santalò. Ho bisogno di assistenza.';
  const ico = `<svg width="15" height="15" viewBox="0 0 24 24" fill="currentColor"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"/></svg>`;
  return `<br>
    <a href="https://wa.me/${CFG.whatsapp_giuseppe}?text=${encodeURIComponent(txt)}" target="_blank" class="wa-btn">${ico} Giuseppe</a>
    <a href="https://wa.me/${CFG.whatsapp_dario}?text=${encodeURIComponent(txt)}" target="_blank" class="wa-btn" style="margin-left:6px">${ico} Dario</a>`;
}

// ─── LOGICA ────────────────────────────────────────────
inp.addEventListener('input',()=>{ inp.style.height='auto'; inp.style.height=Math.min(inp.scrollHeight,100)+'px'; });
inp.addEventListener('keydown', e=>{ if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();handleSend();} });
btn.addEventListener('click', handleSend);

function handleSend() {
  const t=inp.value.trim(); if(!t||isWaiting)return;
  inp.value=''; inp.style.height='auto'; send(t);
}

async function send(text) {
  if(isWaiting)return;
  document.querySelectorAll('.quick-btns').forEach(e=>e.remove());
  addMsg('user',text);
  history.push({role:'user',content:text});
  isWaiting=true; btn.disabled=true; showTyping();

  try {
    const res = await fetch(CFG.workerUrl,{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({ model:'claude-sonnet-4-20250514', max_tokens:1000, system:systemPrompt, messages:history })
    });
    const data = await res.json();
    hideTyping();
    if(data.content&&data.content[0]&&data.content[0].text){
      const reply = data.content[0].text;
      history.push({role:'assistant',content:reply});
      const needsWA = /contatt[ai] (la struttura|il proprietario)|non ho questa informazione/i.test(reply);
      addMsg('bot', reply, needsWA ? waLink(text) : null);
    } else {
      addMsg('bot','Si è verificato un problema tecnico. Riprova tra un momento.', waLink('Problema tecnico col chatbot'));
    }
  } catch(e) {
    hideTyping();
    addMsg('bot','Connessione non disponibile.', waLink());
  }
  isWaiting=false; btn.disabled=false; inp.focus();
}

// ─── INIT ──────────────────────────────────────────────
async function init() {
  showTyping();
  const p = urlParams();
  await loadKB();
  if(p.id) {
    pren = await loadPren(p.id);
    if(!pren && p.nome) pren = { nome:p.nome, camera:p.camera, arrivo:p.arrivo, partenza:p.partenza };
  }
  systemPrompt = buildPrompt(kb, pren);
  hideTyping();

  // Banner ospite
  if(pren && pren.nome) {
    const b=document.getElementById('guestBanner');
    const bt=document.getElementById('guestBannerText');
    b.classList.remove('hidden');
    bt.innerHTML = pren.camera
      ? `Camera <strong>${pren.camera}</strong> · ${pren.arrivo||''} → ${pren.partenza||''}`
      : `Benvenuto/a <strong>${pren.nome.split(' ')[0]}</strong>`;
  }

  const nome1 = pren ? pren.nome.split(' ')[0] : null;
  const welcome = nome1
    ? `Ciao **${nome1}**! 🌿 Benvenuto/a a Santalò B&B.\n\nConosco già la tua prenotazione e sono qui H24 per qualsiasi cosa: accesso alla camera, WiFi, riscaldamento, parcheggio, dove mangiare e molto altro.\n\nCome posso aiutarti?`
    : `Benvenuto/a a **Santalò B&B** 🌿\n\nSono il tuo assistente virtuale, disponibile H24 per qualsiasi domanda sulla struttura.\n\nCome posso aiutarti?`;

  addMsg('bot', welcome);
  addQuick(['🔑 Come accedo alla camera?','📶 Password WiFi','🅿️ Parcheggio','🌡️ Termostato','❄️ Condizionatore','🍽️ Dove mangiare?']);
}

window.addEventListener('DOMContentLoaded', init);
</script>
</body>
</html>
