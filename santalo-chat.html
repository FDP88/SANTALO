<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Alò — Santalò B&B</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --brown: #6B2D1F;
      --brown-d: #3d1a10;
      --brown-l: #8C4F35;
      --sand: #C4A882;
      --sand-l: #E8D9C0;
      --sand-ll: #F5EDE0;
      --cream: #FAF7F2;
      --cream-d: #F3EBE2;
      --ink: #2E241F;
      --muted: #7A6B61;
      --line: rgba(107,45,31,.13);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'DM Sans', system-ui, sans-serif;
      background: var(--cream);
      color: var(--ink);
      height: 100dvh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* HEADER */
    .header {
      background: var(--brown-d);
      color: #fff;
      padding: 14px 18px;
      display: flex;
      align-items: center;
      gap: 14px;
      flex-shrink: 0;
      border-bottom: 1px solid rgba(255,255,255,.08);
    }
    .header-logo {
      width: 42px;
      height: 42px;
      border-radius: 10px;
      background: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      flex-shrink: 0;
    }
    .header-logo img {
      width: 36px;
      height: 36px;
      object-fit: contain;
    }
    .header-info { flex: 1; }
    .header-name {
      font-family: 'Cormorant Garamond', serif;
      font-size: 1.3rem;
      font-weight: 600;
      line-height: 1.1;
      letter-spacing: .01em;
    }
    .header-name span {
      color: var(--sand);
    }
    .header-sub {
      font-size: 0.7rem;
      opacity: 0.65;
      margin-top: 2px;
      display: flex;
      align-items: center;
      gap: 5px;
    }
    .dot-live {
      width: 6px; height: 6px;
      border-radius: 50%;
      background: #4ade80;
      animation: pulse 2s infinite;
    }
    @keyframes pulse { 0%,100%{opacity:1}50%{opacity:.35} }

    /* BANNER OSPITE */
    .guest-banner {
      background: linear-gradient(135deg, #f5ede6, #ede0d0);
      border-bottom: 1px solid var(--line);
      padding: 9px 18px;
      font-size: 12.5px;
      color: var(--brown-d);
      display: flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
    }
    .guest-banner.hidden { display: none; }
    .guest-banner strong { font-weight: 600; }

    /* MESSAGGI */
    .messages {
      flex: 1;
      overflow-y: auto;
      padding: 18px 14px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      scroll-behavior: smooth;
    }
    .messages::-webkit-scrollbar { width: 3px; }
    .messages::-webkit-scrollbar-thumb { background: var(--sand-l); border-radius: 4px; }

    .msg { display: flex; gap: 9px; max-width: 90%; animation: fadeUp .22s ease; }
    @keyframes fadeUp { from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:translateY(0)} }
    .msg.bot { align-self: flex-start; }
    .msg.user { align-self: flex-end; flex-direction: row-reverse; }

    .msg-avatar {
      width: 32px; height: 32px;
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: .85rem;
      flex-shrink: 0;
      margin-top: 2px;
      overflow: hidden;
    }
    .msg.bot .msg-avatar {
      background: var(--brown-d);
      padding: 4px;
    }
    .msg.bot .msg-avatar img {
      width: 100%; height: 100%;
      object-fit: contain;
      filter: brightness(0) invert(1);
    }
    .msg.user .msg-avatar {
      background: var(--cream-d);
      border: 1.5px solid var(--line);
      font-size: 1rem;
    }

    .msg-bubble {
      padding: 10px 14px;
      border-radius: 17px;
      font-size: 14px;
      line-height: 1.65;
      max-width: 100%;
      word-break: break-word;
    }
    .msg.bot .msg-bubble {
      background: #fff;
      border: 1px solid var(--line);
      border-bottom-left-radius: 4px;
      box-shadow: 0 2px 8px rgba(58,30,18,.05);
    }
    .msg.user .msg-bubble {
      background: var(--brown);
      color: #fff;
      border-bottom-right-radius: 4px;
    }
    .msg.bot .msg-bubble strong { color: var(--brown); font-weight: 600; }

    /* QUICK BUTTONS */
    .quick-btns {
      display: flex; flex-wrap: wrap; gap: 6px;
      padding: 2px 0 2px 41px;
      animation: fadeUp .3s ease .1s both;
    }
    .quick-btn {
      background: #fff;
      border: 1.5px solid var(--sand);
      border-radius: 999px;
      padding: 6px 13px;
      font-family: 'DM Sans', sans-serif;
      font-size: 12.5px;
      font-weight: 500;
      color: var(--brown);
      cursor: pointer;
      transition: all .17s;
    }
    .quick-btn:hover { background: var(--brown); color: #fff; border-color: var(--brown); }

    /* TYPING */
    .typing { display: flex; gap: 9px; align-items: flex-end; align-self: flex-start; }
    .typing-bubble {
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 17px; border-bottom-left-radius: 4px;
      padding: 11px 14px;
      display: flex; gap: 5px; align-items: center;
      box-shadow: 0 2px 8px rgba(58,30,18,.05);
    }
    .typing-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--sand); animation: bounce .9s infinite; }
    .typing-dot:nth-child(2){animation-delay:.15s} .typing-dot:nth-child(3){animation-delay:.3s}
    @keyframes bounce{0%,80%,100%{transform:translateY(0)}40%{transform:translateY(-5px)}}

    /* WHATSAPP BTN */
    .wa-btn {
      display: inline-flex; align-items: center; gap: 6px;
      margin-top: 9px; margin-right: 6px;
      background: #25D366; color: #fff !important;
      border: none; border-radius: 999px;
      padding: 8px 15px;
      font-family: 'DM Sans', sans-serif;
      font-size: 12.5px; font-weight: 500;
      cursor: pointer; text-decoration: none;
      transition: background .18s;
    }
    .wa-btn:hover { background: #128C7E; }

    /* INTRO CARD */
    .intro-card {
      background: linear-gradient(135deg, var(--brown-d), var(--brown-l));
      border-radius: 16px;
      padding: 20px;
      margin: 4px 0 8px;
      color: #fff;
      display: flex;
      align-items: center;
      gap: 16px;
    }
    .intro-card-logo {
      width: 56px; height: 56px;
      background: rgba(255,255,255,.12);
      border-radius: 14px;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
    }
    .intro-card-logo img {
      width: 42px; height: 42px;
      object-fit: contain;
      filter: brightness(0) invert(1);
    }
    .intro-card-text h2 {
      font-family: 'Cormorant Garamond', serif;
      font-size: 1.4rem;
      font-weight: 600;
      margin-bottom: 4px;
    }
    .intro-card-text h2 span { color: var(--sand-l); }
    .intro-card-text p { font-size: .8rem; opacity: .75; line-height: 1.5; }

    /* INPUT */
    .input-area { padding: 10px 13px 14px; background: #fff; border-top: 1px solid var(--line); flex-shrink: 0; }
    .input-row {
      display: flex; gap: 8px; align-items: flex-end;
      background: var(--cream); border: 1.5px solid var(--line);
      border-radius: 22px; padding: 7px 7px 7px 13px;
      transition: border-color .2s;
    }
    .input-row:focus-within { border-color: var(--brown); }
    #userInput {
      flex: 1; border: none; background: transparent;
      font-family: 'DM Sans', sans-serif; font-size: 14px;
      color: var(--ink); resize: none; outline: none;
      max-height: 100px; min-height: 22px; line-height: 1.5; padding: 0;
    }
    #userInput::placeholder { color: var(--muted); }
    #sendBtn {
      width: 37px; height: 37px; border-radius: 50%; border: none;
      background: var(--brown); color: #fff; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0; transition: all .17s;
    }
    #sendBtn:hover { background: var(--brown-l); }
    #sendBtn:disabled { background: var(--sand-l); cursor: not-allowed; }
    #sendBtn svg { width: 16px; height: 16px; }
    .input-hint { font-size: 10px; color: var(--muted); text-align: center; margin-top: 7px; opacity: 0.65; }

    @media (min-width: 600px) {
      body { background: var(--cream-d); align-items: center; justify-content: center; flex-direction: row; }
      .chat-wrap { width: 100%; max-width: 460px; height: min(800px, 95dvh); border-radius: 22px; overflow: hidden; box-shadow: 0 8px 40px rgba(58,30,18,.15), 0 32px 80px rgba(58,30,18,.12); display: flex; flex-direction: column; }
    }
  </style>
</head>

var kb = null, pren = null, history = [], isWaiting = false, systemPrompt = '';

function urlParams() {
  var p = new URLSearchParams(location.search);
  return { id: p.get('prenotazione_id'), nome: p.get('nome'), camera: p.get('camera'), arrivo: p.get('arrivo'), partenza: p.get('partenza') };
}

    .then(function(r) { if (r.ok) return r.json(); })
    .then(function(data) { if (data) kb = data; })
    .catch(function() {});

    headers: { apikey: CFG.supabaseKey, Authorization: 'Bearer ' + CFG.supabaseKey }
  }).then(function(r) { if (r.ok) return r.json(); })
    .then(function(d) { return d && d[0] ? d[0] : null; })

var msgEl = document.getElementById('messages');
var inp = document.getElementById('userInput');
var btnEl = document.getElementById('sendBtn');

function scroll() { setTimeout(function() { msgEl.scrollTo({top: msgEl.scrollHeight, behavior: 'smooth'}); }, 50); }

function fmt(t) {
  return t.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/\*\*(.+?)\*\*/g,'<strong></strong>')
    .replace(/\*(.+?)\*/g,'<em></em>')
    .replace(/\n/g,'<br>');
}

var LOGO_DATA = 'https://fdp88.github.io/SANTALO/santalo-logo.png';

function addMsg(role, text, extra) {
  var w = document.createElement('div'); w.className = 'msg ' + role;
  var av = document.createElement('div'); av.className = 'msg-avatar';
  if (role === 'bot') {
    var img = document.createElement('img');
    img.src = LOGO_DATA; img.alt = 'Alo';
    av.appendChild(img);
  } else {
    av.textContent = '&#128100;';
    av.innerHTML = '&#128100;';
  }
  var bub = document.createElement('div'); bub.className = 'msg-bubble';
  bub.innerHTML = fmt(text);
  if (extra) { var e = document.createElement('div'); e.innerHTML = extra; bub.appendChild(e); }
  w.appendChild(av); w.appendChild(bub); msgEl.appendChild(w); scroll();
}

function showTyping() {
  var w = document.createElement('div'); w.className = 'typing'; w.id = 'typing';
  var av = document.createElement('div'); av.className = 'msg-avatar';
  av.style.cssText = 'background:var(--brown-d);padding:4px';
  var img = document.createElement('img');
  img.src = LOGO_DATA; img.alt = 'Alo';
  img.style.cssText = 'width:100%;height:100%;object-fit:contain;filter:brightness(0) invert(1)';
  av.appendChild(img);
  var b = document.createElement('div'); b.className = 'typing-bubble';
  b.innerHTML = '<div class="typing-dot"></div><div class="typing-dot"></div><div class="typing-dot"></div>';
  w.appendChild(av); w.appendChild(b); msgEl.appendChild(w); scroll();
}
function hideTyping() { var e = document.getElementById('typing'); if (e) e.remove(); }

function addQuick(labels) {
  var w = document.createElement('div'); w.className = 'quick-btns';
  labels.forEach(function(l) {
    var b = document.createElement('button'); b.className = 'quick-btn'; b.textContent = l;
    b.onclick = function() { w.remove(); send(l); };
    w.appendChild(b);
  });
  msgEl.appendChild(w); scroll();
}

var WA_ICO = '<svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"/></svg>';

function waLink(msg) {
  var txt = msg ? 'Ciao, sono un ospite del B&B Santalo. Ho bisogno di assistenza: ' + msg : 'Ciao, sono un ospite del B&B Santalo. Ho bisogno di assistenza.';
  return '<br><a href="https://wa.me/' + CFG.whatsapp_giuseppe + '?text=' + encodeURIComponent(txt) + '" target="_blank" class="wa-btn">' + WA_ICO + ' Giuseppe</a>' +
    '<a href="https://wa.me/' + CFG.whatsapp_dario + '?text=' + encodeURIComponent(txt) + '" target="_blank" class="wa-btn">' + WA_ICO + ' Dario</a>';
}

inp.addEventListener('input', function() { inp.style.height = 'auto'; inp.style.height = Math.min(inp.scrollHeight, 100) + 'px'; });
inp.addEventListener('keydown', function(e) { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); handleSend(); } });
btnEl.addEventListener('click', handleSend);

function handleSend() {
  var t = inp.value.trim();
  if (!t || isWaiting) return;
  inp.value = ''; inp.style.height = 'auto'; send(t);
}

function send(text) {
  if (isWaiting) return;
  document.querySelectorAll('.quick-btns').forEach(function(e) { e.remove(); });
  addMsg('user', text);
  history.push({role: 'user', content: text});
  isWaiting = true; btnEl.disabled = true; showTyping();

  fetch(CFG.workerUrl, {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({model: 'claude-sonnet-4-20250514', max_tokens: 1000, system: systemPrompt, messages: history})
  }).then(function(r) { return r.json(); })
    .then(function(data) {
      hideTyping();
      if (data.content && data.content[0] && data.content[0].text) {
        var reply = data.content[0].text;
        history.push({role: 'assistant', content: reply});
        var needsWA = /motivi di sicurezza|contatt[ai] (la struttura|il proprietario)|non ho questa informazione|pulsanti qui sotto/i.test(reply);
        addMsg('bot', reply, needsWA ? waLink(text) : null);
      } else {
        addMsg('bot', 'Si e\' verificato un problema tecnico. Riprova tra un momento.', waLink('Problema tecnico'));
      }
      isWaiting = false; btnEl.disabled = false; inp.focus();
    })
    .catch(function() {
      hideTyping();
      addMsg('bot', 'Connessione non disponibile al momento.', waLink());
      isWaiting = false; btnEl.disabled = false;
    });
}

function init() {
  showTyping();
  var params = urlParams();
  loadKB().then(function() {
    var pren_promise = params.id ? loadPren(params.id) : Promise.resolve(null);
    return pren_promise;
  }).then(function(p) {
    if (p) { pren = p; }
    else if (params.nome) { pren = {nome: params.nome, camera: params.camera, arrivo: params.arrivo, partenza: params.partenza}; }
    systemPrompt = buildPrompt(kb, pren);
    hideTyping();

    if (pren && pren.nome) {
      var banner = document.getElementById('guestBanner');
      var bannerText = document.getElementById('guestBannerText');
      banner.classList.remove('hidden');
      bannerText.innerHTML = pren.camera
        ? 'Camera <strong>' + pren.camera + '</strong> · ' + (pren.arrivo || '') + ' &rarr; ' + (pren.partenza || '')
        : 'Benvenuto/a <strong>' + pren.nome.split(' ')[0] + '</strong>';
    }

    var nome1 = pren ? pren.nome.split(' ')[0] : null;

    var introHtml = '<div class="intro-card">' +
      '<div class="intro-card-logo"><img src="' + LOGO_DATA + '" alt="Santalo"/></div>' +
      '<div class="intro-card-text">' +
      '<h2>Ciao' + (nome1 ? ' ' + nome1 : '') + ', sono Al<span style="color:var(--sand-l)">o</span>!</h2>' +
      '<p>Il tuo assistente personale H24 per tutto quello che ti serve durante il soggiorno a Bitonto.</p>' +
      '</div></div>';

    var welcome = introHtml + '\n\nSono qui per aiutarti con: accesso alla camera, WiFi, parcheggio, riscaldamento, dove mangiare e molto altro.\n\nCome posso aiutarti?';
    addMsg('bot', welcome);
    addQuick(['Come accedo?', 'WiFi', 'Parcheggio', 'Termostato', 'Condizionatore', 'Dove mangiare?']);
  });
}

window.addEventListener('DOMContentLoaded', init);
</script>
</body>
</html>
