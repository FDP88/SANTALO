<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<title>Santalò Chat</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body {
  font-family: Arial, sans-serif;
  background: #f5f3f0;
  margin: 0;
}

.header {
  background: #6B2D1F;
  color: white;
  padding: 20px;
  font-size: 22px;
}

.chat {
  padding: 15px;
  height: 70vh;
  overflow-y: auto;
}

.message {
  margin: 10px 0;
  padding: 10px;
  border-radius: 10px;
  max-width: 80%;
}

.user {
  background: #ddd;
  margin-left: auto;
}

.bot {
  background: #C4A882;
  color: white;
}

.input-area {
  display: flex;
  padding: 10px;
  background: white;
}

input {
  flex: 1;
  padding: 10px;
}

button {
  padding: 10px;
  background: #6B2D1F;
  color: white;
  border: none;
}
</style>
</head>

<body>

<div class="header">
Santalò B&B Chat
</div>

<div id="chat" class="chat"></div>

<div class="input-area">
<input id="input" placeholder="Scrivi un messaggio..." />
<button onclick="send()">Invia</button>
</div>

<script>
const urlParams = new URLSearchParams(window.location.search);

const prenotazione = {
  nome: urlParams.get("nome"),
  camera: urlParams.get("camera"),
  arrivo: urlParams.get("arrivo"),
  partenza: urlParams.get("partenza")
};

function addMessage(text, type) {
  const div = document.createElement("div");
  div.className = "message " + type;
  div.innerText = text;
  document.getElementById("chat").appendChild(div);
}

async function send() {
  const input = document.getElementById("input");
  const text = input.value;

  if (!text) return;

  addMessage(text, "user");
  input.value = "";

  const res = await fetch("https://ifdqcnjdnblvtflqsqmt.supabase.co/functions/v1/santalo-chatbot", {
    method: "POST",
    headers: {
      "Content-Type": "application/json"
    },
    body: JSON.stringify({
      message: text,
      prenotazione: prenotazione
    })
  });

  const data = await res.json();

  addMessage(data.reply, "bot");
}
</script>

</body>
</html>
